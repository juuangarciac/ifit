# ============================================================================
# DOCKER COMPOSE - IFIT (SOLO SERVICIOS INFRAESTRUCTURA)
# ============================================================================
#
# USO:
#   docker-compose up -d
#
# Servicios:
#   - MySQL: Base de datos
#   - Keycloak: Servidor OAuth2
#
# Nota: API Gateway, iFit, Ronnie y Admin-Panel se ejecutan localmente
#
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # MYSQL - BASE DE DATOS
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: ifit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ifit}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ifit-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # KEYCLOAK - SERVIDOR OAUTH2
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ifit-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "9090:9090"
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  ifit-network:
    driver: bridge
    name: ifit-network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  mysql_data:
    name: ifit_mysql_data
