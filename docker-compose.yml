# ============================================================================
# DOCKER COMPOSE - IFIT SISTEMA COMPLETO (DESARROLLO Y PRODUCCIÓN)
# ============================================================================
#
# USO:
#   Desarrollo (localhost):
#     docker-compose up -d
#
#   Producción (env vars):
#     SPRING_PROFILES_ACTIVE=production docker-compose up -d
#
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # MYSQL - BASE DE DATOS
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: ifit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-ifit}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ifit-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # KEYCLOAK - SERVIDOR OAUTH2
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ifit-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "9090:9090"
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==========================================================================
  # API GATEWAY - PUNTO DE ENTRADA ÚNICO
  # ==========================================================================
  gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ifit-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SERVER_PORT=8080
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:9090/realms/ifit-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:9090/realms/ifit-realm/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ==========================================================================
  # IFIT - MICROSERVICIO PRINCIPAL
  # ==========================================================================
  ifit:
    build:
      context: ./ifit
      dockerfile: Dockerfile
    container_name: ifit-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-ifit}
      - SPRING_DATASOURCE_USERNAME=${DB_ROOT_PASSWORD:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:9090/realms/ifit-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:9090/realms/ifit-realm/protocol/openid-connect/certs
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-springboot-ifit-client}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - KEYCLOAK_TOKEN_URL=http://keycloak:9090/realms/ifit-realm/protocol/openid-connect/token
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:9090
      - RONNIE_SERVICE_URL=http://ronnie:8082
      - SPRING_MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ==========================================================================
  # RONNIE - MICROSERVICIO IA (LANGCHAIN4J + GROQ)
  # ==========================================================================
  ronnie:
    build:
      context: ./ronnie
      dockerfile: Dockerfile
    container_name: ifit-ronnie
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SERVER_PORT=8082
      - SERVER_SERVLET_CONTEXT_PATH=/ifit/aimodels/api/v1
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${DB_NAME:-ifit}
      - SPRING_DATASOURCE_USERNAME=${DB_ROOT_PASSWORD:-root}
      - SPRING_DATASOURCE_PASSWORD=${DB_ROOT_PASSWORD:-root}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:9090/realms/ifit-realm
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:9090/realms/ifit-realm/protocol/openid-connect/certs
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_healthy
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/ifit/aimodels/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==========================================================================
  # ADMIN-PANEL - INTERFAZ DE ADMINISTRACIÓN (VAADIN)
  # ==========================================================================
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: ifit-admin-panel
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-docker}
      - SERVER_PORT=8084
      - IFIT_GATEWAY_BASE_URL=http://gateway:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  ifit-network:
    driver: bridge
    name: ifit-network

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  mysql_data:
    name: ifit_mysql_data
