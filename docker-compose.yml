# ============================================================================
# DOCKER COMPOSE - SISTEMA IFIT COMPLETO
# ============================================================================
# 
# Servicios:
#   1. MySQL          - Base de datos
#   2. Keycloak       - Servidor OAuth2/OIDC
#   3. Ollama         - Modelos LLM locales
#   4. Eureka Server  - Service Discovery
#   5. API Gateway    - Punto de entrada único
#   6. AuthAPI        - Autenticación
#   7. IFIT           - Microservicio principal
#   8. RONNIE         - Microservicio IA
#
# Uso:
#   docker-compose up -d          # Iniciar todo
#   docker-compose down           # Detener todo
#   docker-compose logs -f        # Ver logs
#
# ============================================================================

services:
  # ==========================================================================
  # MYSQL - BASE DE DATOS (USADA POR IFIT Y RONNIE)
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: ifit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"  # Host:Container
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - ifit-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================================
  # KEYCLOAK - SERVIDOR OAUTH2
  # ==========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ifit-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "9090:9090"
    networks:
      - ifit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

