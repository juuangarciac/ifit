# ============================================================================
# NETWORKS - COMUNICACIÓN ENTRE CONTENEDORES
# ============================================================================
networks:
  ifit-network:
    driver: bridge
    name: ifit-network

# ============================================================================
# VOLUMES - PERSISTENCIA DE DATOS
# ============================================================================
volumes:
  mysql_data:
    name: ifit_mysql_data
  ollama_data:
    name: ifit_ollama_data
