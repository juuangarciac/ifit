spring.application.name=ifit
ifit.default.user.role=ROLE_USER

# --- SERVER CONFIGURATION ---
server.port=8081

# --- DATOS DE CONEXIÓN A LA BBDD ---
spring.datasource.url=jdbc:mysql://localhost:3306/ifit
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql,classpath:excercise_catalog_esp.sql
spring.jpa.defer-datasource-initialization=true

# --- JPA & HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql: true

# --- Java Mail Sender ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ifit.communication@gmail.com
spring.mail.password=didvevmjhcdxnlik
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# OpenAPI/Swagger Configuration
# ============================================
# Rutas de documentación
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Ordenación
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Habilitar documentación
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Configuración de servidores (ver OpenApiConfig.java)
# Los servidores se configuran en la clase @Configuration para mayor flexibilidad

# Keycloak Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/ifit-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/ifit-realm/protocol/openid-connect/certs

jwt.auth.converter.resource-id=springboot-ifit-client
jwt.auth.converter.principle-attribute=preferred_username

# Keycloak Logging
keycloak.client-id=springboot-ifit-client
keycloak.client-secret=9XYXADrLbtprpSCTAtrIPXcBCtQDBOCt
keycloak.token-url=http://localhost:9090/realms/ifit-realm/protocol/openid-connect/token
keycloak.logout-url=${keycloak.auth-server-url}/realms/${keycloak.realm}/protocol/openid-connect/logout

# Debug configuration
keycloak.auth-server-url=http://localhost:9090
keycloak.realm=ifit-realm
logging.level.org.keycloak = DEBUG
logging.level.org.springframework.security = DEBUG
logging.level.ifit.authentication_service.Keycloak = DEBUG

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# CRÍTICO: Usa IP en lugar de hostname
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
# ID único para identificar la instancia
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Support ticket recipient
ifit.support.email=ifit.communication@gmail.com