<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de soporte - IFit</title>
</head>
<body style="margin: 0; padding: 0; background-color: #222831; font-family: Arial, sans-serif; color: #EEEEEE;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 0;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #393E46; padding: 30px; border-radius: 8px;">

                    <!-- Cabecera -->
                    <tr>
                        <td align="center" style="padding-bottom: 20px;">
                            <h1 style="color: #FFD369; margin: 0;">Nuevo ticket de soporte</h1>
                            <p style="margin: 8px 0 0 0; font-size: 14px; color: #CCCCCC;">IFit — Sistema de soporte técnico</p>
                        </td>
                    </tr>

                    <!-- Datos del usuario -->
                    <tr>
                        <td style="padding-bottom: 20px;">
                            <table width="100%" cellpadding="8" cellspacing="0" style="background-color: #2E333A; border-radius: 6px; font-size: 14px;">
                                <tr>
                                    <td style="color: #FFD369; font-weight: bold; width: 130px;">Usuario</td>
                                    <td style="color: #EEEEEE;">{{userName}}</td>
                                </tr>
                                <tr>
                                    <td style="color: #FFD369; font-weight: bold;">Email</td>
                                    <td style="color: #EEEEEE;">{{userEmail}}</td>
                                </tr>
                                <tr>
                                    <td style="color: #FFD369; font-weight: bold;">Categoría</td>
                                    <td style="color: #EEEEEE;">{{category}}</td>
                                </tr>
                                <tr>
                                    <td style="color: #FFD369; font-weight: bold;">Fecha</td>
                                    <td style="color: #EEEEEE;">{{submittedAt}}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Asunto -->
                    <tr>
                        <td style="padding-bottom: 10px;">
                            <p style="margin: 0; font-size: 13px; color: #FFD369; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Asunto</p>
                            <p style="margin: 6px 0 0 0; font-size: 16px; color: #EEEEEE; font-weight: bold;">{{subject}}</p>
                        </td>
                    </tr>

                    <!-- Mensaje -->
                    <tr>
                        <td style="padding-bottom: 20px;">
                            <p style="margin: 0; font-size: 13px; color: #FFD369; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">Mensaje</p>
                            <div style="margin-top: 8px; background-color: #2E333A; border-radius: 6px; padding: 16px; font-size: 15px; color: #EEEEEE; line-height: 1.6; white-space: pre-wrap;">{{message}}</div>
                        </td>
                    </tr>

                    <!-- Pie -->
                    <tr>
                        <td align="center" style="padding-top: 10px; font-size: 12px; color: #888888;">
                            <p style="margin: 0;">© IFit 2025 - Panel de soporte interno</p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>

</body>
</html>
