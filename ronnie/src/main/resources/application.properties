spring.application.name=ronnie

# Server Configuration
server.port=8082
server.servlet.context-path=/ifit/aimodels/api/v1

eureka.instance.hostname=ifit-aimodels-service
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- DATOS DE CONEXIÓN A LA BBDD ---
spring.datasource.url=jdbc:mysql://localhost:3308/Ronnie
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always

# --- JPA & HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update

# --- OLLAMA CONFIGURATION ---
# URL donde corre Ollama (por defecto localhost:11434)
ollama.base-url=http://localhost:11434
# Modelo a usar (debe estar descargado en Ollama)
ollama.model-name=llama3.1:latest
# Timeout para las peticiones (en segundos)
ollama.timeout=120

# Model Memory Configuration
chat.memory.max-tokens=500
chat.memory.max-messages=10
