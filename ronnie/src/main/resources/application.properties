# ============================================================================
# RONNIE · application.properties
# ============================================================================

# ── Aplicación ──────────────────────────────────────────────────────────────
spring.application.name=ronnie

# ── Servidor ────────────────────────────────────────────────────────────────
server.port=8082

# ── Base de datos (MySQL) ───────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ronnie
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ── Seguridad · OAuth2 Resource Server (Keycloak) ───────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/ifit-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9090/realms/ifit-realm/protocol/openid-connect/certs

# ── LLM · Groq (beans en GroqModelConfiguration.java) ───────────────────────
groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${GROQ_API_KEY}
# Modelo de CHAT
groq.model-name=llama-3.3-70b-versatile
# Modelo de GENERACIÓN DE RUTINAS (JSON). Si se quita, usa groq.model-name como fallback.
groq.routine-model-name=openai/gpt-oss-120b
groq.timeout=1200

# ── Memoria de conversación (LangChain4j) ───────────────────────────────────
chat.memory.max-tokens=500
chat.memory.max-messages=10

# ── Service Discovery (Eureka) ──────────────────────────────────────────────
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── Documentación API (OpenAPI / Swagger) ───────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
