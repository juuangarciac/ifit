# ============================================================================
# APPLICATION-DOCKER.PROPERTIES
# ============================================================================
# 
# Perfil específico para ejecución en contenedores Docker.
# Se activa con: SPRING_PROFILES_ACTIVE=docker
#
#
# ============================================================================

# ============================================================================
# CONFIGURACIÓN COMÚN PARA TODOS LOS MICROSERVICIOS
# ============================================================================

# Eureka Client - Service Discovery
# IMPORTANTE: Usar "eureka" en lugar de "localhost"
eureka.client.service-url.defaultZone=http://eureka:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${spring.application.name}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Esperar a que Eureka esté disponible
eureka.client.initial-instance-info-replication-interval-seconds=10
eureka.client.instance-info-replication-interval-seconds=10
eureka.client.registry-fetch-interval-seconds=10

# Logging
logging.level.root=INFO
logging.level.com.ifit=DEBUG
logging.level.org.springframework.cloud=DEBUG

# Actuator para health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.eureka.enabled=true

# ============================================================================
# CONFIGURACIÓN ESPECÍFICA POR MICROSERVICIO
# ============================================================================
# Descomenta y ajusta según el microservicio:

# ----------------------------------------------------------------------------
# RONNIE (Microservicio IA)
# ----------------------------------------------------------------------------
spring.application.name=RONNIE
server.port=8082
server.servlet.context-path=/ifit/aimodels/api/v1

# # Database
spring.datasource.url=jdbc:mysql://mysql:3306/Ronnie
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# # Ollama Configuration
ollama.base-url=http://ollama:11434
ollama.model-name=llama3.1:8b
ollama.timeout=120


