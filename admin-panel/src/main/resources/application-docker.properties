# ── Admin Panel — Configuración para Docker ───────────────────────────────────
# Activa con: -Dspring.profiles.active=docker

spring.application.name=admin-panel
server.port=8084

# Gateway vía DNS interno del docker network
ifit.gateway.base-url=http://gateway:8080

# Vaadin
vaadin.launch-browser=false
vaadin.allowed-packages=com.uca.juangarcia.adminpanel

logging.level.com.uca.juangarcia.adminpanel=INFO
