# ============================================================================
# ADMIN PANEL · application.properties
# ============================================================================

# ── Aplicación ──────────────────────────────────────────────────────────────
spring.application.name=admin-panel

# ── Servidor (el Gateway usa el 8080) ───────────────────────────────────────
server.port=8090

# ── Integración con el API Gateway (todo el tráfico del panel pasa por aquí) ─
ifit.gateway.base-url=http://localhost:8080

# ── Vaadin ──────────────────────────────────────────────────────────────────
vaadin.launch-browser=true
vaadin.allowed-packages=com.uca.juangarcia.adminpanel

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.uca.juangarcia.adminpanel=DEBUG
