# ── iFit Admin Panel ───────────────────────────────────────────────────────────
spring.application.name=admin-panel

# Puerto propio (el Gateway usa el 8080)
server.port=8090

# URL base del API Gateway: TODO el tráfico del panel pasa por aquí.
ifit.gateway.base-url=http://localhost:8080

# Vaadin
vaadin.launch-browser=true
# Paquetes a escanear por Vaadin (rutas/vistas)
vaadin.allowed-packages=com.uca.juangarcia.adminpanel

logging.level.com.uca.juangarcia.adminpanel=DEBUG
